[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stepinfer"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4.0,<2.10.0",
    "transformers>=4.56.0,<=4.57.3",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "huggingface-hub>=0.36.2",
    "ipykernel>=7.4.0",
    "modelscope>=1.40.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
